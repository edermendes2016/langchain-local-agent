# The same 18 reference questions as eval/langchain.yaml, written in English.
# Used to compare retrieval quality across languages (python evaluate.py -r langchain --dataset langchain.en --tag=-en).
- id: lc01
  question: Where is the abstract base class for chat models defined?
  expected_files: [libs/core/langchain_core/language_models/chat_models.py]
  keywords: [BaseChatModel]
- id: lc02
  question: Which class implements chaining runnables with the pipe operator, running one after another?
  expected_files: [libs/core/langchain_core/runnables/base.py]
  keywords: [RunnableSequence]
- id: lc03
  question: Where is the class that runs several runnables in parallel on the same input?
  expected_files: [libs/core/langchain_core/runnables/base.py]
  keywords: [RunnableParallel]
- id: lc04
  question: Which class represents the AI response message, with tool calls and usage metadata?
  expected_files: [libs/core/langchain_core/messages/ai.py]
  keywords: [AIMessage]
- id: lc05
  question: Where is the prompt template for conversations with a list of system and user messages defined?
  expected_files: [libs/core/langchain_core/prompts/chat.py]
  keywords: [ChatPromptTemplate]
- id: lc06
  question: Which parser converts the model output into plain text?
  expected_files: [libs/core/langchain_core/output_parsers/string.py]
  keywords: [StrOutputParser]
- id: lc07
  question: Where is the decorator that turns a Python function into a tool for agents?
  expected_files: [libs/core/langchain_core/tools/convert.py]
  keywords: [tool]
- id: lc08
  question: What is the abstract interface for document retrievers and which method do they implement?
  expected_files: [libs/core/langchain_core/retrievers.py]
  keywords: [BaseRetriever]
- id: lc09
  question: Where is the Document class that holds the page content and the metadata?
  expected_files: [libs/core/langchain_core/documents/base.py]
  keywords: [Document]
- id: lc10
  question: Where is the callback manager that fires the start and end events of a run?
  expected_files: [libs/core/langchain_core/callbacks/manager.py]
  keywords: [CallbackManager]
- id: lc11
  question: Is there an in-memory vector store? Where is it implemented?
  expected_files: [libs/core/langchain_core/vectorstores/in_memory.py]
  keywords: [InMemoryVectorStore]
- id: lc12
  question: Which interface defines how texts are converted into embeddings?
  expected_files: [libs/core/langchain_core/embeddings/embeddings.py]
  keywords: [Embeddings]
- id: lc13
  question: How is the in-memory cache of model responses implemented?
  expected_files: [libs/core/langchain_core/caches.py]
  keywords: [InMemoryCache]
- id: lc14
  question: Where is the in-memory rate limiter for model calls?
  expected_files: [libs/core/langchain_core/rate_limiters.py]
  keywords: [InMemoryRateLimiter]
- id: lc15
  question: Which function ensures a valid RunnableConfig, filling in default values?
  expected_files: [libs/core/langchain_core/runnables/config.py]
  keywords: [ensure_config]
- id: lc16
  question: Where is the prompt template with few-shot examples?
  expected_files: [libs/core/langchain_core/prompts/few_shot.py]
  keywords: [FewShotPromptTemplate]
- id: lc17
  question: Which class parses the model output as JSON?
  expected_files: [libs/core/langchain_core/output_parsers/json.py]
  keywords: [JsonOutputParser]
- id: lc18
  question: Where is the function that trims a list of messages to fit a token limit?
  expected_files: [libs/core/langchain_core/messages/utils.py]
  keywords: [trim_messages]
